name: Validate exam data and app build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CROWN_PASSWORD: ci-test-password-only

jobs:
  validate:
    name: Validate schema, Crown lock and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Crown lock
        run: npm run generate:crown-lock

      - name: Validate exams and Crown lock
        id: validate-exams
        shell: bash
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee validation.log

      - name: Build app
        run: npm --ignore-scripts run build

      - name: Comment validation failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### CI validation failed'
            echo
            echo '```text'
            tail -n 120 validation.log 2>/dev/null || echo 'No validation log was produced.'
            echo '```'
          } > validation-comment.md
          gh pr comment "$PR_NUMBER" --body-file validation-comment.md
