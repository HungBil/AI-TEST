name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest
    env:
      CROWN_PASSWORD: ${{ secrets.CROWN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Crown password secret
        shell: bash
        run: |
          if [ -z "${CROWN_PASSWORD:-}" ]; then
            echo "::error::Required repository secret CROWN_PASSWORD is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Crown lock
        run: npm run generate:crown-lock

      - name: Validate exams
        run: npm run validate

      - name: Build app
        run: npm --ignore-scripts run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
