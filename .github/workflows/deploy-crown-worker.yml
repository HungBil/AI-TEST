name: Deploy Crown authentication Worker

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CROWN_PASSWORD: ${{ secrets.CROWN_PASSWORD }}
          CROWN_TOKEN_SECRET: ${{ secrets.CROWN_TOKEN_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CROWN_PASSWORD"
          test ${#CROWN_TOKEN_SECRET} -ge 32

      - name: Test Worker
        run: node workers/crown-auth/test.mjs

      - name: Deploy Worker code
        working-directory: workers/crown-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.36.0 deploy --keep-vars

      - name: Upload Worker secrets
        working-directory: workers/crown-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CROWN_PASSWORD: ${{ secrets.CROWN_PASSWORD }}
          CROWN_TOKEN_SECRET: ${{ secrets.CROWN_TOKEN_SECRET }}
        run: |
          printf '%s' "$CROWN_PASSWORD" | npx --yes wrangler@4.36.0 secret put CROWN_PASSWORD
          printf '%s' "$CROWN_TOKEN_SECRET" | npx --yes wrangler@4.36.0 secret put CROWN_TOKEN_SECRET
